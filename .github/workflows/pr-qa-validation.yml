name: QA CI Pipeline - PR & Code Validation

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-execution:
    name: Pruebas Automáticas (.NET 8 + Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      # 1. Clonar el repositorio
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      # 2. Instalar el SDK de .NET 8
      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restaurar e Instalar Dependencias del Proyecto
      - name: Restaurar Paquetes NuGet
        run: dotnet restore

      # 4. Compilar la Solución .NET
      - name: Compilar Solución (.NET 8)
        run: dotnet build --configuration Release --no-restore

      # 5. Instalar los Navegadores de Playwright
      - name: Instalar Navegadores de Playwright
        run: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps

      # 6. Ejecutar las Pruebas de QA con Inyección de Secretos
      - name: Ejecutar Pruebas E2E & API en ${{ matrix.browser }}
        env:
          QA_ENV: 'QA'
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: |
          dotnet test --configuration Release --no-build --logger "trx;LogFileName=test_results_${{ matrix.browser }}.trx"

      # 7. Generar los Resultados de Allure Report (Nativo npm)
      - name: Instalar Allure CLI y Generar Reporte HTML
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          npx allure generate bin/Release/net8.0/allure-results --clean -o allure-report

      # 8. Guardar Evidencias y Reporte Allure HTML en GitHub Artifacts
      - name: Subir Evidencias y Reporte Allure (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-y-reporte-allure-${{ matrix.browser }}
          path: |
            allure-report/
            bin/Release/net8.0/evidencias/
            bin/Release/net8.0/*.trx
          retention-days: 7

      # 9. Enviar Notificación por Correo Electrónico (Solo si las credenciales de SMTP existen)
      - name: Enviar Reporte por Correo Electrónico
        if: always() && secrets.SMTP_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "📊 [QA CI/CD] Reporte de Pruebas .NET 8 - Status: ${{ job.status }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO || 'qa-team@empresa.com' }}
          from: "GitHub Actions QA Robot <qa-robot@empresa.com>"
          body: |
            Hola Equipo de QA,

            Se ha completado la ejecución de la suite de pruebas automáticas en GitHub Actions.

            📌 Detalle de Ejecución:
            - Estado: ${{ job.status }}
            - Navegador: ${{ matrix.browser }}
            - Disparado por: ${{ github.actor }}
            - Rama / Commit: ${{ github.ref_name }} (${{ github.sha }})

            🔗 Ver ejecución y descargar evidencias en GitHub:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 10. Publicar Comentario Adherido (Sticky Comment) en el PR con los Resultados de QA
      - name: Comentar Resultados en el Pull Request (Sticky Comment)
        if: always() && github.event_name == 'pull_request' && matrix.browser == 'chromium'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: qa-test-summary
          message: |
            ### ${{ job.status == 'success' && '✅' || '❌' }} Reporte Automático de QA en PR #${{ github.event.number }}

            - **Estado de la Ejecución:** `${{ job.status }}`
            - **Framework:** `.NET 8 + Playwright C#`
            - **Autor:** @${{ github.actor }}
            - **Rama:** `${{ github.head_ref }}`

            📊 **Reporte y Evidencias de este PR:**
            - 📦 **Allure HTML & Videos (15.5 KB):** [Descargar Artefactos del Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 🌐 **Dashboard Oficial de Main:** [Ver GitHub Pages](https://gustavo-umeres.github.io/mi-proyecto-qa/) *(Se actualiza tras hacer el Merge)*

            🔗 [Ver Detalles del Run en GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
